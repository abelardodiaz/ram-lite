[package]
name = "ram-lite"
version = "0.1.0"
description = "Widget nativo minimo (Win32 + GDI) con el uso de RAM de Windows, y CPU y discos opcionales"
authors = ["Abelardo Diaz"]
license = "MIT"
repository = "https://github.com/abelardodiaz/ram-lite"
edition = "2024"
rust-version = "1.90"
publish = false

# Una sola dependencia: las APIs de Windows. Nada de red ni JSON; un solo hilo corto para WSL.
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
